[package]
name = "samloader-odin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Samsung device download mode Odin client"
keywords = ["samsung", "firmware"]

[dependencies]
samloader-pit = { workspace = true }
memmap2 = { workspace = true }
tar = { workspace = true }
nusb = { workspace = true, optional = true }
binrw = { workspace = true }
fast-md5 = { workspace = true }
thiserror = { workspace = true }
lz4_flex = { workspace = true }
async-trait = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures-timer = { workspace = true }
rusb = { workspace = true, optional = true }
serialport = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { workspace = true, features = ["wasm-bindgen"] }

[dev-dependencies]
pollster = { workspace = true }

[features]
default = ["nusb"]
rusb = ["dep:rusb"]
nusb = ["dep:nusb"]
serialport = ["dep:serialport"]
mock = []
